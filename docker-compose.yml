services:
  postgre_db:
    image: postgres:15-alpine
    container_name: rag_postgres
    restart: always
    env_file:
      - ./RAG_Backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - rag_network

  backend:
    build: ./RAG_Backend
    container_name: rag_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./RAG_Backend/.env
    environment:
      - HF_HUB_DISABLE_PROGRESS_BARS=0
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    volumes:
      - ./RAG_Backend/storage:/app/storage
      - ./RAG_Backend/data:/app/data
      - ./hf_cache:/root/.cache/huggingface
    depends_on:
      - postgre_db
    networks:
      - rag_network

  frontend:
    build: ./RAG_Frontend
    container_name: rag_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - rag_network

volumes:
  postgres_data:

networks:
  rag_network:
    driver: bridge
